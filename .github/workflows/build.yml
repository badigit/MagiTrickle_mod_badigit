name: Build and Package OPKG

on:
  push:
    branches-ignore:
      - 'refs/tags/*'
      - release
    paths-ignore:
      - '**.md'
      - '.github/**'
      - '!.github/workflows/build.yml'
  release:
    types: [published]

jobs:
  prepare:
    name: Prepare build matrix
    runs-on: ubuntu-latest
    outputs:
      configs: ${{ steps.collect.outputs.configs }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Build config matrix
        id: collect
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          configs = sorted(Path("config").glob("*/*.config"))
          if not configs:
              raise SystemExit("No build configs found")

          matrix = []
          for config in configs:
              platform = config.parent.name
              target = config.stem
              matrix.append({
                  "config": config.as_posix(),
                  "platform": platform,
                  "target": target,
                  "name": f"{platform}_{target}",
              })

          print(f"configs={json.dumps(matrix, separators=(',', ':'))}")
          PY

  build_frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.JS
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Build frontend
        run: |
          make download_frontend
          make build_frontend

      - name: Upload frontend artifacts
        uses: actions/upload-artifact@v5
        with:
          name: frontend-dist
          path: ./src/frontend/dist
          if-no-files-found: error

  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: [prepare, build_frontend]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.configs) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: src/backend/go.sum

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot upx

      - name: Install apk-tools
        if: ${{ matrix.platform == 'openwrt' }}
        run: |
          docker run --rm -v /usr/local/bin:/mnt alpine:edge sh -c "apk add --no-cache apk-tools-static && cp /sbin/apk.static /mnt/apk && chmod +x /mnt/apk"

      - name: Download frontend artifacts
        uses: actions/download-artifact@v5
        with:
          name: frontend-dist
          path: ./src/frontend/dist

      - name: Build and Package
        run: |
          cp "${{ matrix.config }}" .config
          make download_backend build_backend
          # prepare_files depends on build (backend+frontend), but frontend
          # is already pre-built as a separate job artifact in ./src/frontend/dist.
          # Call prepare_files without its build dependency.
          make -o build prepare_files
          make -o build -o prepare_files package

      - name: Collect package files
        id: package_outputs
        run: |
          mapfile -t packages < <(
            find .build -maxdepth 1 -type f \( -name "magitrickle_*.ipk" -o -name "magitrickle_*.apk" \) | sort
          )

          if [ "${#packages[@]}" -eq 0 ]; then
            echo "No package files found" >&2
            exit 1
          fi

          for i in "${!packages[@]}"; do
            index=$((i + 1))
            file="${packages[$i]}"
            echo "package_${index}_path=${file}" >> "$GITHUB_OUTPUT"
            echo "package_${index}_name=$(basename "${file}")" >> "$GITHUB_OUTPUT"
          done

      - name: Upload package artifact 1
        if: ${{ github.event_name != 'release' && steps.package_outputs.outputs.package_1_path != '' }}
        uses: actions/upload-artifact@v5
        with:
          name: ${{ steps.package_outputs.outputs.package_1_name }}
          path: ${{ steps.package_outputs.outputs.package_1_path }}
          if-no-files-found: error
          compression-level: 0

      - name: Upload package artifact 2
        if: ${{ github.event_name != 'release' && steps.package_outputs.outputs.package_2_path != '' }}
        uses: actions/upload-artifact@v5
        with:
          name: ${{ steps.package_outputs.outputs.package_2_name }}
          path: ${{ steps.package_outputs.outputs.package_2_path }}
          if-no-files-found: error
          compression-level: 0

      - name: Upload asset to release 1
        if: ${{ github.event_name == 'release' && steps.package_outputs.outputs.package_1_path != '' }}
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.package_outputs.outputs.package_1_path }}
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Upload asset to release 2
        if: ${{ github.event_name == 'release' && steps.package_outputs.outputs.package_2_path != '' }}
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.package_outputs.outputs.package_2_path }}
          token: ${{ secrets.RELEASE_TOKEN }}
